name: Temp Diagnostic 4
on:
  push:
    paths:
      - '.github/workflows/temp-diag4.yml'
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Call endpoint and save
        run: |
          curl -sL "https://script.google.com/macros/s/AKfycbxlsbGdDPP42Cxm11jkDG7W9XK_SelXOrmKBxhK9PxUtZSXifFERC2yCkrUhamFJaqFPA/exec?payload=%7B%22action%22%3A%22getBekleyenAlisFaturalari%22%7D" -o diag4-output.txt
          git config user.email "diag@bot.local"
          git config user.name "diag-bot"
          git add diag4-output.txt
          git commit -m "diag4 output" || echo "no changes"
          git push
